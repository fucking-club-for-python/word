<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>単語帳ツール</title>
<style>

.row{display:flex;gap:8px}.row button{flex:1;padding:14px;font-size:18px}
</style></head><body>
<h2>単語帳ツール</h2>
<p><span id="c"></span></p>
<div class="tabs"><button id="t1" class="on">検索</button><button id="t2">テスト</button></div>

<section id="s1">
<input id="q" placeholder="例：a と入力" autocomplete="off">
<ul id="list"></ul>
</section>

<section id="s2" hidden>
<div id="setup">
<p>範囲 No.<input id="a" type="number" style="width:80px"> 〜 <input id="b" type="number" style="width:80px"></p>
<p><select id="dir"><option value="0">英語 → 日本語</option><option value="1">日本語 → 英語</option></select>
<label><input type="checkbox" id="sh" checked>シャッフル</label></p>
<button id="go">スタート</button>
</div>
<div id="play" hidden>
<div id="prog"></div>
<div id="card"></div>
<div class="row" id="btns"><button id="ng">間違えた ←</button><button id="ok">できた →</button></div>
<p class="hint">カードをタップ（またはスペース）でめくる</p>
</div>
<div id="res" hidden>
<h3 id="score"></h3>
<div id="ngl"></div>
<button id="again">間違えた単語だけ復習</button>
<button id="back">設定に戻る</button>
</div>
</section>

function init(){
  $("c").textContent=D.length+"語収録";
  if(D.length){
    $("a").value=D[0].n;
    $("b").value=Math.min(D[0].n+49,D[D.length-1].n);
  }
  search();
}

/* タブ */
function tab(n){
  $("s1").hidden=n!=1;$("s2").hidden=n!=2;
  $("t1").className=n==1?"on":"";$("t2").className=n==2?"on":"";
}
$("t1").onclick=()=>tab(1);$("t2").onclick=()=>tab(2);

/* 検索 */
function search(){
  const k=$("q").value.trim().toLowerCase();
  if(!k){$("list").innerHTML="";return}
  $("list").innerHTML=D.filter(d=>d.w.toLowerCase().startsWith(k))
    .map(d=>`<li><b>${esc(d.w)}</b><small>No.${d.n}</small><div>${esc(d.m)}</div></li>`).join("");
}
$("q").oninput=search;

/* テスト */
let Q=[],i=0,ng=[],flip=false,last=[];
function view(v){
  $("setup").hidden=v!="setup";$("play").hidden=v!="play";$("res").hidden=v!="res";
}
function start(list){
  last=list;
  Q=list.slice();
  if($("sh").checked){
    for(let j=Q.length-1;j>0;j--){
      const k=Math.floor(Math.random()*(j+1));
      [Q[j],Q[k]]=[Q[k],Q[j]];
    }
  }
  i=0;ng=[];view("play");draw();
}
function draw(){
  flip=false;show();
}
function show(){
  const d=Q[i],e2j=$("dir").value=="0";
  const front=e2j?d.w:d.m,back=e2j?d.m:d.w;
  $("prog").textContent=(i+1)+" / "+Q.length+"　（No."+d.n+"）";
  $("card").innerHTML=`<div class="f">${esc(front)}</div>`+
    (flip?`<hr style="width:100%;opacity:.3"><div class="b">${esc(back)}</div>`
         :`<div class="hint">タップでめくる</div>`);
}
function next(){
  i++;
  if(i>=Q.length){finish()}else{draw()}
}
function finish(){
  const okN=Q.length-ng.length;
  $("score").textContent="結果："+okN+" / "+Q.length+" できた";
  $("ngl").innerHTML=ng.length
    ?"<p>間違えた単語（"+ng.length+"個）：</p><ul>"+ng.slice().sort((a,b)=>a.n-b.n).map(d=>`<li><b>${esc(d.w)}</b><small>No.${d.n}</small><div>${esc(d.m)}</div></li>`).join("")+"</ul>"
    :"<p>全問できました！</p>";
  $("again").hidden=!ng.length;
  view("res");
}
$("go").onclick=()=>{
  const a=+$("a").value,b=+$("b").value;
  const L=D.filter(d=>d.n>=Math.min(a,b)&&d.n<=Math.max(a,b));
  if(!L.length){alert("該当する単語がありません。範囲を確認してください。");return}
  start(L);
};
$("card").onclick=()=>{flip=!flip;show()};
$("ok").onclick=()=>next();
$("ng").onclick=()=>{ng.push(Q[i]);next()};
$("btns").onmousedown=e=>e.preventDefault();
$("again").onclick=()=>start(ng.slice());
$("back").onclick=()=>view("setup");
document.addEventListener("keydown",e=>{
  if($("s2").hidden||$("play").hidden)return;
  if(e.key==" "||e.key=="Enter"){e.preventDefault();flip=!flip;show()}
  else if(e.key=="ArrowRight"){$("ok").click()}
  else if(e.key=="ArrowLeft"){$("ng").click()}
});

init();
</script></body></html>
