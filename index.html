<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>単語帳ツール</title>

<style>
  :root { color-scheme: light dark; }

  /* ---------- 全体 ---------- */
  body {
    font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
    max-width: 720px;
    margin: 0 auto;
    padding: 16px;
    line-height: 1.5;
  }
  input, select, button { font-size: 16px; padding: 8px 10px; margin: 2px; }
  button { cursor: pointer; }
  small  { opacity: .6; margin-left: 6px; }

  /* ---------- タブ ---------- */
  .tabs button    { padding: 8px 20px; }
  .tabs button.on { font-weight: bold; border-bottom: 3px solid #2a6df4; }

  /* ---------- 検索・単語リスト ---------- */
  #query { width: 100%; box-sizing: border-box; font-size: 20px; }
  ul     { padding: 0; }
  li     { list-style: none; border: 1px solid #8885; border-radius: 8px; padding: 8px 10px; margin: 6px 0; }
  li b   { font-size: 18px; }

  /* ---------- テスト ---------- */
  #card {
    display: flex;
    flex-direction: column;
    justify-content: center;
    min-height: 180px;
    margin: 12px 0;
    padding: 24px;
    border: 2px solid #8885;
    border-radius: 16px;
    text-align: center;
    cursor: pointer;
  }
  #card hr { width: 100%; opacity: .3; }
  .front   { font-size: 28px; font-weight: bold; }
  .back    { font-size: 20px; margin-top: 8px; }
  .hint    { font-size: 13px; opacity: .5; margin-top: 12px; }

  .answer-buttons        { display: flex; gap: 8px; }
  .answer-buttons button { flex: 1; padding: 14px; font-size: 18px; }
</style>
</head>

<body>
<h2>単語帳ツール</h2>
<p id="count"></p>

<div class="tabs">
  <button id="tab-search" class="on">検索</button>
  <button id="tab-test">テスト</button>
</div>

<!-- ========== 検索ページ ========== -->
<section id="page-search">
  <input id="query" placeholder="例：a と入力" autocomplete="off">
  <ul id="results"></ul>
</section>

<!-- ========== テストページ ========== -->
<section id="page-test" hidden>

  <!-- 1) 設定 -->
  <div id="setup">
    <p>
      範囲 No.<input id="range-from" type="number" style="width:80px">
      〜
      <input id="range-to" type="number" style="width:80px">
    </p>
    <p>
      <select id="direction">
        <option value="en-ja">英語 → 日本語</option>
        <option value="ja-en">日本語 → 英語</option>
      </select>
      <label><input type="checkbox" id="shuffle" checked>シャッフル</label>
    </p>
    <button id="start">スタート</button>
  </div>

  <!-- 2) 出題 -->
  <div id="play" hidden>
    <div id="progress"></div>
    <div id="card"></div>
    <div class="answer-buttons" id="buttons">
      <button id="btn-wrong">間違えた ←</button>
      <button id="btn-right">できた →</button>
    </div>
    <p class="hint">カードをタップ（またはスペース）でめくる</p>
  </div>

  <!-- 3) 結果 -->
  <div id="result" hidden>
    <h3 id="score"></h3>
    <div id="wrong-list"></div>
    <button id="retry">間違えた単語だけ復習</button>
    <button id="back">設定に戻る</button>
  </div>

</section>

/* =====================================================
   画面要素
   ===================================================== */
const $ = id => document.getElementById(id);

const el = {
  count: $("count"),
  tabSearch: $("tab-search"), tabTest: $("tab-test"),
  pageSearch: $("page-search"), pageTest: $("page-test"),

  query: $("query"), results: $("results"),

  from: $("range-from"), to: $("range-to"),
  direction: $("direction"), shuffle: $("shuffle"), start: $("start"),

  setup: $("setup"), play: $("play"), result: $("result"),
  progress: $("progress"), card: $("card"), buttons: $("buttons"),
  btnWrong: $("btn-wrong"), btnRight: $("btn-right"),
  score: $("score"), wrongList: $("wrong-list"),
  retry: $("retry"), back: $("back"),
};


/* =====================================================
   共通の関数
   ===================================================== */
const ESCAPES = { "&": "&amp;", "<": "&lt;", ">": "&gt;" };
const escapeHtml = text => text.replace(/[&<>]/g, ch => ESCAPES[ch]);

/** 単語1件ぶんのHTML（検索結果・間違い一覧で共通） */
const wordItem = w => `
  <li>
    <b>${escapeHtml(w.en)}</b><small>No.${w.no}</small>
    <div>${escapeHtml(w.ja)}</div>
  </li>`;

/** 配列をランダムに並べ替えた新しい配列を返す（Fisher-Yates） */
function shuffled(array) {
  const copy = [...array];
  for (let i = copy.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy;
}


/* =====================================================
   タブの切り替え
   ===================================================== */
function showTab(name) {
  const isSearch = name === "search";
  el.pageSearch.hidden = !isSearch;
  el.pageTest.hidden = isSearch;
  el.tabSearch.classList.toggle("on", isSearch);
  el.tabTest.classList.toggle("on", !isSearch);
}


/* =====================================================
   検索（前方一致）
   ===================================================== */
function renderSearch() {
  const key = el.query.value.trim().toLowerCase();
  el.results.innerHTML = key
    ? WORDS.filter(w => w.en.toLowerCase().startsWith(key)).map(wordItem).join("")
    : "";
}


/* =====================================================
   テスト（フラッシュカード）
   ===================================================== */
const test = {
  cards: [],       // 出題する単語
  index: 0,        // 今何問目か（0始まり）
  wrong: [],       // 間違えた単語
  flipped: false,  // カードがめくられているか
};

/** 設定 / 出題 / 結果 のどれかを表示する */
function showPanel(name) {
  for (const key of ["setup", "play", "result"]) {
    el[key].hidden = key !== name;
  }
}

function startTest(words) {
  test.cards = el.shuffle.checked ? shuffled(words) : [...words];
  test.index = 0;
  test.wrong = [];
  test.flipped = false;
  showPanel("play");
  renderCard();
}

function renderCard() {
  const word = test.cards[test.index];
  const enToJa = el.direction.value === "en-ja";
  const front = enToJa ? word.en : word.ja;
  const back  = enToJa ? word.ja : word.en;

  el.progress.textContent = `${test.index + 1} / ${test.cards.length}（No.${word.no}）`;
  el.card.innerHTML =
    `<div class="front">${escapeHtml(front)}</div>` +
    (test.flipped
      ? `<hr><div class="back">${escapeHtml(back)}</div>`
      : `<div class="hint">タップでめくる</div>`);
}

function flipCard() {
  test.flipped = !test.flipped;
  renderCard();
}

/** 「できた」(true) か「間違えた」(false) を記録して次へ進む */
function answer(isRight) {
  if (!isRight) test.wrong.push(test.cards[test.index]);
  test.index++;

  if (test.index >= test.cards.length) {
    showResult();
  } else {
    test.flipped = false;
    renderCard();
  }
}

function showResult() {
  const total = test.cards.length;
  const wrongCount = test.wrong.length;
  const wrongSorted = [...test.wrong].sort((a, b) => a.no - b.no);

  el.score.textContent = `結果：${total - wrongCount} / ${total} できた`;
  el.wrongList.innerHTML = wrongCount
    ? `<p>間違えた単語（${wrongCount}個）：</p><ul>${wrongSorted.map(wordItem).join("")}</ul>`
    : "<p>全問できました！</p>";
  el.retry.hidden = wrongCount === 0;
  showPanel("result");
}

function onStartClick() {
  const from = Math.min(+el.from.value, +el.to.value);
  const to   = Math.max(+el.from.value, +el.to.value);
  const words = WORDS.filter(w => w.no >= from && w.no <= to);

  if (words.length === 0) {
    alert("該当する単語がありません。範囲を確認してください。");
    return;
  }
  startTest(words);
}


/* =====================================================
   イベント登録
   ===================================================== */
el.tabSearch.addEventListener("click", () => showTab("search"));
el.tabTest.addEventListener("click", () => showTab("test"));

el.query.addEventListener("input", renderSearch);

el.start.addEventListener("click", onStartClick);
el.card.addEventListener("click", flipCard);
el.btnRight.addEventListener("click", () => answer(true));
el.btnWrong.addEventListener("click", () => answer(false));
el.retry.addEventListener("click", () => startTest(test.wrong));
el.back.addEventListener("click", () => showPanel("setup"));

// ボタンにフォーカスが残ってスペースキーが誤作動しないようにする
el.buttons.addEventListener("mousedown", e => e.preventDefault());

// キーボード操作：スペース/Enter=めくる、→=できた、←=間違えた
document.addEventListener("keydown", e => {
  if (el.pageTest.hidden || el.play.hidden) return;

  if (e.key === " " || e.key === "Enter") { e.preventDefault(); flipCard(); }
  else if (e.key === "ArrowRight") answer(true);
  else if (e.key === "ArrowLeft")  answer(false);
});


/* =====================================================
   初期化
   ===================================================== */
el.count.textContent = `${WORDS.length}語収録`;
el.from.value = WORDS[0].no;
el.to.value = Math.min(WORDS[0].no + 49, WORDS[WORDS.length - 1].no);
</script>
